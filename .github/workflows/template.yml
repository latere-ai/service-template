# The template's own pre-merge gate.
#
# Every other workflow in this repository is workflow_call only, because they
# are the pipelines a consumer repository calls. None of them runs here, so
# without this file the template ships gates it never runs against itself.
#
# It runs one target. The Makefile decides what a gate is, so the pipeline and
# a developer's machine cannot disagree about what passing means.
name: template

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1

      - name: Build, test, generate, and lint
        run: make all
