# The template's own pre-merge gate.
#
# Every other workflow in this repository is workflow_call only, because they
# are the pipelines a consumer repository calls. None of them runs here, so
# without this file the template ships gates it never runs against itself.
#
# The gates are the shared ones from latere-ai/ci, reached through this
# repository's Makefile: go-verify probes the Makefile and runs the targets it
# finds, so the pipeline and a developer's machine cannot disagree about what
# passing means. What is specific to a template rather than to a Go repository
# -- the skeleton compiled and linted as source, and the committed reference
# service diffed against a fresh generation -- is the `validate` target, which
# go-verify runs as a job of its own.
name: template

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: latere-ai/ci/.github/workflows/go-verify.yml@v1
