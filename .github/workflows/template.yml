# The template's own pre-merge gate.
#
# Every other workflow in this repository is either called by a consumer
# (workflow_call) or runs on a release tag. Without this file the template
# ships gates it never runs against itself.
#
# Two jobs. verify is the shared bar from latere-ai/ci, run against the root
# module: the gates `go tool lateregate list` names, the same ones a developer
# runs with `make check`. validate is what is specific to a template rather
# than to a Go repository, and what the shared bar cannot see: the skeleton
# compiled, tested, and linted as its own module, the manifest proved
# complete, the committed reference service compared against a fresh
# generation, and the adoption proof, which scaffolds four repositories from
# this tree and runs the shared bar and their own checks in each, the drift
# check among them.
name: template

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: latere-ai/ci/.github/workflows/lateregate.yml@v1

  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            skeleton/go.sum
      - name: Skeleton, manifest, reference service, and adoption proof
        run: make validate
