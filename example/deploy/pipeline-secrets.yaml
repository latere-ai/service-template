# The credentials the release pipeline uses, declared so a consumer learns
# about a missing one during setup rather than halfway through a release.
#
# kind is federated or stored. A federated entry is exchanged at run time for
# a short-lived token and nothing is kept in the repository; the value under
# `subject` is the trust policy the receiving side must carry, scoped to the
# repository, the workflow file, and the ref pattern. A policy scoped to the
# organization alone lets any repository in it assume the identity, which
# removes the point of the exercise.
#
# A stored entry is the fallback for a service with no federation support. It
# carries the narrowest available grant and a recorded expiry. `tools/release
# secrets` fails the build when a recorded expiry is within thirty days, and
# an entry with no expiry is rejected outright.
secrets:
  - name: registry
    kind: federated
    purpose: Push the release image and its attestations.
    scope: Write to this repository's package namespace only.
    used_by: [preflight, build, attest]
    subject: repo:OWNER/REPO:ref:refs/tags/v*
    workflow: .github/workflows/release.yml

  - name: signing
    kind: federated
    purpose: Obtain a keyless signing certificate for the image digest.
    scope: One certificate per run, bound to the run identity.
    used_by: [preflight, attest]
    subject: repo:OWNER/REPO:ref:refs/tags/v*
    workflow: .github/workflows/release.yml

  - name: cluster
    kind: federated
    purpose: Apply the target overlay and wait for the rollout.
    scope: >-
      One namespace per target, with the verbs the rollout needs: get, list,
      watch, create, patch, and update on the workload, service, account, and
      disruption budget. No cluster-scoped grant.
    used_by: [preflight, deploy, rollback]
    subject: repo:OWNER/REPO:ref:refs/tags/v*
    workflow: .github/workflows/release.yml
