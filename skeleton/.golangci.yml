# The lint baseline. Every enabled linter is listed here.
#
# The configuration starts from `default: none` on purpose. An additive
# configuration inherits whatever set the tool ships with, so a tool upgrade
# silently changes which rules apply and the change never appears in a diff.
version: "2"

run:
  # An explicit budget. Without one the tool applies its own default and a slow
  # run looks like a hang in CI.
  timeout: 5m
  # Test files are code. Excluding them creates a second, lower standard for
  # the code that proves the first one.
  tests: true

linters:
  default: none
  enable:
    # Correctness: defects the compiler accepts.
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Modernization: keeps the code on current standard library idiom.
    - modernize
    # Boundaries: blocks imports that break the layering the template fixes.
    - depguard
    # Logging: enforces the log calls that carry trace context.
    - sloglint

  settings:
    errcheck:
      # No blanket exclusions. An ignored error is written as an explicit
      # assignment with a comment, never as a silent drop.
      check-type-assertions: true
      # A deliberately dropped error is written as an assignment to the blank
      # identifier with a comment saying why, which is the escape the rule
      # depends on, so the blank form stays legal.
      check-blank: false

    govet:
      enable-all: true
      disable:
        # Field alignment optimizes memory layout at the cost of grouping
        # related fields, and the template values readable structs.
        - fieldalignment
        # Shadowing flags the idiomatic "if err := f(); err != nil" inside a
        # function that already holds an err, so it reports style far more
        # often than a defect.
        - shadow

    staticcheck:
      # Everything except the documentation-comment style checks, which judge
      # comment wording rather than correctness and are the tool's own default
      # omissions. The list is explicit so an upgrade is a reviewable edit.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022

    depguard:
      rules:
        # Applies to every file: the standard library choices the template
        # fixes for the whole module.
        stdlib:
          list-mode: lax
          files:
            - $all
          # depguard matches a denied package by prefix, so the structured
          # logging package is named here to keep the "log" entry below from
          # reaching it.
          allow:
            - log/slog
            - math/rand/v2
          deny:
            - pkg: io/ioutil
              desc: deprecated; use io and os
            - pkg: math/rand
              desc: use math/rand/v2
            - pkg: log
              desc: use log/slog; slog.NewLogLogger adapts it for http.Server.ErrorLog
            - pkg: github.com/pkg/errors
              desc: use the standard errors package with %w
        # Persistence and background work sit below transport. A package that
        # reaches upward couples the storage schema to the HTTP surface and
        # cannot be exercised without a server.
        below-transport:
          list-mode: lax
          files:
            - '**/internal/store/**'
            - '**/internal/worker/**'
          deny:
            - pkg: net/http
              desc: the storage and worker layers sit below transport
            - pkg: example.com/service/internal/httpx
              desc: the storage and worker layers sit below transport
            - pkg: example.com/service/internal/handler
              desc: the storage and worker layers sit below transport
            - pkg: example.com/service/internal/server
              desc: the storage and worker layers sit below transport
            - pkg: example.com/service/internal/web
              desc: the storage and worker layers sit below transport
        # Configuration is read before anything else is constructed, so it
        # depends on nothing the template owns.
        configuration:
          list-mode: lax
          files:
            - '**/internal/config/**'
          deny:
            - pkg: example.com/service/internal/store
              desc: configuration is loaded before any component exists
            - pkg: example.com/service/internal/server
              desc: configuration is loaded before any component exists
            - pkg: example.com/service/internal/handler
              desc: configuration is loaded before any component exists

    sloglint:
      # A log record on the request path without the request context carries no
      # trace or span identifier, so it cannot be correlated with the request
      # that produced it. The exclusion below scopes this to the request path.
      context: all
      no-mixed-args: true
      static-msg: false

  exclusions:
    generated: lax
    # The frontend dependency tree is inside the module directory, so the Go
    # tool walks it. The Go files a JavaScript package happens to carry are
    # not this repository's code and are not this repository's to fix.
    paths:
      - (^|/)node_modules/
    # The request-path rule is written once and anchored to the directories
    # the layout spec fixes, so the same expression holds in every consumer
    # and the rule cannot be weakened by moving code.
    rules:
      - linters:
          - sloglint
        path-except: (^|/)internal/(auth|handler|httpx|server|web)/

# A gate reports every finding it has. The tool truncates repeated findings by
# default, which turns a list of twenty into a list of three and hides the rest
# until the first three are fixed.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
