# Core group: the Go module baseline, the build entry point, formatting and
# lint configuration, the pre-commit hook, the shared test helpers, and the
# coverage gate.
#
# Modes follow the contract. go.mod and go.sum are seed because a consumer adds
# its own requirements on the first day, and a drift-checked module file would
# make that an error. The Makefile and .gitignore are merged because a consumer
# owns targets and ignores outside the managed region. Everything the template
# defines the content of is generated.
files:
  # Module baseline.
  - path: go.mod
    mode: seed
    profiles: [service, library]
  - path: go.sum
    mode: seed
    profiles: [service, library]

  # Build entry point. The generator renames the directory to the service name.
  - path: cmd/service/main.go
    mode: seed
    profiles: [service]
  - path: cmd/service/main_test.go
    mode: seed
    profiles: [service]
  - path: cmd/service/outbound_test.go
    mode: seed
    profiles: [service]

  # Feature wiring. Each file assigns the seam the entry point calls, so the
  # entry point never names a package a repository did not select and compiles
  # whatever subset of the features is on.
  - path: cmd/service/startup_test.go
    mode: seed
    profiles: [service]
  - path: cmd/service/database.go
    mode: seed
    profiles: [service]
    features: [database]
  - path: cmd/service/database_test.go
    mode: seed
    profiles: [service]
    features: [database]
  - path: cmd/service/frontend.go
    mode: seed
    profiles: [service]
    features: [frontend]
  - path: cmd/service/frontend_test.go
    mode: seed
    profiles: [service]
    features: [frontend]
  - path: cmd/service/background.go
    mode: seed
    profiles: [service]
    features: [background]
  - path: cmd/service/background_test.go
    mode: seed
    profiles: [service]
    features: [background]

  # Build metadata compiled into the binary.
  - path: internal/version/version.go
    mode: generated
    profiles: [service]
  - path: internal/version/version_test.go
    mode: generated
    profiles: [service]

  # The dependency set the runtime packages import. It holds blank imports only
  # and is removed once every dependency has a real caller.
  - path: internal/deps/deps.go
    mode: seed
    profiles: [service]

  # Make entry point and the core fragment.
  - path: Makefile
    mode: merged
  - path: make/core.mk
    mode: generated
    profiles: [service, library]

  # Formatting, hooks, and ignores.
  - path: .githooks/pre-commit
    mode: generated
  - path: .gitignore
    mode: merged

  # The gate configuration. The gates themselves are latere.ai/x/ci-gate,
  # pinned in go.mod as a tool dependency; this file declares what they assert
  # for this repository.
  #
  # .golangci.yml is deliberately not here. golangci-lint cannot inherit a
  # shared configuration, so `make lint-config` renders it on every run and it
  # is gitignored: a committed copy makes drift detectable, regenerating makes
  # it impossible.
  - path: .lateregate.yaml
    mode: generated
    profiles: [service, library]

  # Shared test helpers: the required-versus-optional dependency rule, and the
  # gates that prove the hook and the lint configuration still enforce what
  # they claim.
  - path: internal/testsupport/dependency.go
    mode: generated
    profiles: [service, library]
  - path: internal/testsupport/dependency_test.go
    mode: generated
    profiles: [service, library]
  - path: internal/testsupport/githooks_test.go
    mode: generated
    profiles: [service, library]
  - path: internal/testsupport/lintconfig_test.go
    mode: generated
    profiles: [service, library]
  - path: internal/testsupport/testdata/lint/go.mod
    mode: generated
    profiles: [service, library]
  - path: internal/testsupport/testdata/lint/internal/handler/handler.go
    mode: generated
    profiles: [service, library]
  - path: internal/testsupport/testdata/lint/internal/store/store.go
    mode: generated
    profiles: [service, library]
  - path: internal/testsupport/racegate_test.go
    mode: generated
    profiles: [service, library]
  - path: internal/testsupport/testdata/race/go.mod
    mode: generated
    profiles: [service, library]
  - path: internal/testsupport/testdata/race/race_test.go
    mode: generated
    profiles: [service, library]
