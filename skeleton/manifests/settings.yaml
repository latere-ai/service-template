# Settings group: the repository configuration that makes the pipeline
# binding, the ownership file, the tracked suppressions, and the command that
# applies them.
#
# The declaration and the make targets are generated, because a repository that
# quietly relaxes its own protection rule is the failure this group exists to
# prevent. CODEOWNERS and the suppression file are seed: the template decides
# which paths need an owner and how a suppression is written, the repository
# decides who its owners are and what it suppresses.
files:
  # The workflow callers. They are the consumer's whole pipeline: each one
  # calls the reusable workflow that holds the jobs, so a change to the
  # pipeline reaches every repository without a file change here. ci.yml runs
  # the fleet's shared per-push bar, verify.yml the service-specific checks
  # the bar does not cover, and ci-gate-bump.yml keeps the bar's pin current.
  # The job ids in the ci and verify callers name the required status checks,
  # which is why the callers are generated rather than seed. The shared bar
  # and its pin live in the Go module, so a frontend-only repository has
  # neither caller.
  - path: .github/workflows/ci.yml
    mode: generated
    profiles: [service, library]
  - path: .github/workflows/verify.yml
    mode: generated
  - path: .github/workflows/ci-gate-bump.yml
    mode: generated
    profiles: [service, library]
  - path: .github/workflows/settings.yml
    mode: generated

  # The declared settings and the ownership they require.
  - path: .github/settings.yml
    mode: generated
  - path: .github/CODEOWNERS
    mode: seed

  # Tracked scanner suppressions. The verify pipeline fails on an expired
  # entry and on an inline suppression with no entry here.
  - path: .github/suppressions.yml
    mode: seed

  # The command that applies the declaration, reports drift, and checks that
  # the gate is a required status check.
  - path: tools/settings/main.go
    mode: generated
  - path: tools/settings/declaration.go
    mode: generated
  - path: tools/settings/github.go
    mode: generated
  - path: tools/settings/plan.go
    mode: generated
  - path: tools/settings/apply.go
    mode: generated
  - path: tools/settings/codeowners.go
    mode: generated
  - path: tools/settings/settings_test.go
    mode: generated
  - path: tools/settings/codeowners_test.go
    mode: generated
  - path: tools/settings/declaration_test.go
    mode: generated
  - path: tools/settings/failure_test.go
    mode: generated

  # Make targets.
  - path: make/settings.mk
    mode: generated
